name: Automated Price Sync

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs automatically every 3 hours (8 times a day)
  workflow_dispatch:     # Allows manual execution anytime from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Live Provider Rates
        run: python scripts/sync_prices.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/services-data.js
          if ! git diff --cached --exit-code; then
            git commit -m "chore: auto sync provider prices [skip ci]"
            git push
          else
            echo "No price updates needed."
          fi
